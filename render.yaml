services:
  - type: web
    name: acutrace-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: CORS_ORIGINS
        value: "https://accutarce.vercel.app"
      - key: MAX_FILE_SIZE_MB
        value: "25"
      - key: MAX_FILES_PER_REQUEST
        value: "10"
    healthCheckPath: /health
